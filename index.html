<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#F2F5FB;--surface:#FFFFFF;--ink:#14213D;--muted:#55627F;--line:#DCE3F1;
  --brand:#2F5BEA;--brand-ink:#FFFFFF;--soft:#E6ECFD;--accent:#FFC43D;--good:#178A6B;--bad:#B3261E;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424;--surface:#172037;--ink:#EAF0FF;--muted:#9BA8C8;--line:#2A3556;
    --brand:#7B9CFF;--brand-ink:#0E1424;--soft:#20305A;--good:#4CC9A2;--bad:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424;--surface:#172037;--ink:#EAF0FF;--muted:#9BA8C8;--line:#2A3556;
  --brand:#7B9CFF;--brand-ink:#0E1424;--soft:#20305A;--good:#4CC9A2;--bad:#FF8A80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:18px 20px calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,9vw,2.9rem);font-weight:800}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.25rem}
.brand svg{width:30px;height:30px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:26px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .3s}
.btn{appearance:none;border:0;font:inherit;font-weight:600;cursor:pointer;min-height:52px;padding:0 22px;border-radius:14px;background:var(--brand);color:var(--brand-ink);width:100%;font-size:1.02rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:42px;width:auto;font-size:.92rem;padding:0 16px}
.btn:focus-visible,.chip:focus-visible,.sc:focus-visible,summary:focus-visible,.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stack{display:grid;gap:12px}
.hero{margin:6px 0 26px}
.hero svg{width:100%;max-width:290px;display:block;margin:0 auto 22px}
.hero h1{margin-bottom:14px}
.hero p{font-size:1.06rem;color:var(--muted)}
.hexline{stroke:var(--line);fill:none;stroke-width:2}
.hexdot{fill:var(--surface);stroke:var(--brand);stroke-width:2}
.hexdot.hot{fill:var(--accent);stroke:var(--accent)}
.hexletter{font-family:var(--display);font-weight:800;font-size:15px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.note{font-size:.88rem;color:var(--muted);text-align:center;margin-top:16px}
.install{margin-top:18px;padding:14px 16px;border:1.5px dashed var(--line);border-radius:14px;font-size:.92rem;color:var(--muted)}
.install b{color:var(--ink)}
.q{margin-bottom:26px}
.q h3{margin-bottom:10px}
.q .hint{font-size:.88rem;color:var(--muted);margin:-4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;font:inherit;font-size:.95rem;cursor:pointer;padding:10px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.opt{display:block;width:100%;text-align:left;border-radius:14px;padding:14px 16px}
.opt small{display:block;color:inherit;opacity:.75;font-size:.85rem}
.qcount{font-size:.9rem;color:var(--muted);margin-bottom:10px}
.qtext{font-family:var(--display);font-weight:600;font-size:clamp(1.4rem,6vw,1.75rem);line-height:1.2;margin-bottom:28px;min-height:5.4em}
.qlead{color:var(--muted);font-size:.95rem;margin-bottom:8px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sc{appearance:none;font:inherit;font-weight:800;font-family:var(--display);font-size:1.35rem;cursor:pointer;height:64px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.sc[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.scl{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin:8px 2px 26px}
.nav{display:flex;gap:10px}
.code{display:flex;gap:8px;margin:12px 0 14px}
.code span{width:46px;height:46px;border-radius:12px;background:var(--accent);color:#14213D;font-family:var(--display);font-weight:800;font-size:1.4rem;display:grid;place-items:center}
.radar{width:100%;display:block;margin:6px auto 6px;max-width:400px}
.radar .g{fill:none;stroke:var(--line);stroke-width:1.2}
.radar .ax{stroke:var(--line);stroke-width:1.2}
.radar .poly{fill:var(--brand);fill-opacity:.25;stroke:var(--brand);stroke-width:2.5;stroke-linejoin:round;transform-origin:170px 150px;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.radar .pt{fill:var(--brand)}
.radar text{font-family:var(--body);font-size:11.5px;fill:var(--muted);text-anchor:middle}
.radar text.top3{fill:var(--ink);font-weight:600}
@keyframes grow{from{transform:scale(.05);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.radar .poly{animation:none}.bar i{transition:none}}
.sec{margin-top:30px}
.sec h2{margin-bottom:6px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pct{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--good);white-space:nowrap}
.meter{height:6px;border-radius:6px;background:var(--line);margin:10px 0 12px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.card p.d{color:var(--muted);font-size:.95rem}
details{margin-top:8px}
summary{cursor:pointer;font-weight:600;font-size:.92rem;color:var(--brand);padding:6px 0;list-style:none}
summary::-webkit-details-marker{display:none}
details p{font-size:.92rem;padding:2px 0 4px}
ul.steps{margin:10px 0 0;padding-left:20px;display:grid;gap:8px}
.bars{display:grid;gap:8px;margin-top:10px}
.brow{display:grid;grid-template-columns:110px 1fr 38px;align-items:center;gap:10px;font-size:.9rem}
.brow .m{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.brow .m i{display:block;height:100%;background:var(--brand);border-radius:8px}
.brow b{text-align:right;font-family:var(--display)}
.foot{font-size:.82rem;color:var(--muted);margin-top:26px;text-align:center}
.link{background:none;border:0;font:inherit;color:var(--brand);text-decoration:underline;cursor:pointer;padding:6px}
.inp{width:100%;min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1.1rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:0 16px;margin:4px 0 12px}
.inp:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-size:.92rem;min-height:1.4em;margin:-4px 0 10px}
.price{font-family:var(--display);font-weight:800;font-size:1.3rem}
.sep{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.88rem;margin:26px 0 18px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.92rem;z-index:9}
</style>
</head>

function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function buildQs(len){
  const n=len==="completo"?6:3,qs=[];
  for(let i=0;i<n;i++)for(const a of ORDER)qs.push({a,t:QTXT[a][i]});
  return qs;
}
function scores(qs,ans){
  const s={},n={};ORDER.forEach(a=>{s[a]=0;n[a]=0});
  qs.forEach((q,i)=>{s[q.a]+=ans[i];n[q.a]++});
  const p={};ORDER.forEach(a=>{p[a]=Math.round((s[a]-n[a])/(n[a]*4)*100)});
  return p;
}
function rank(p,prof){
  return CAREERS.map(c=>{
    let sc=(p[c.c[0]]*2+p[c.c[1]])/3;
    const m=c.s.filter(x=>prof.subj.includes(x)).length;
    sc+=Math.min(m,2)*6;
    if(prof.time==="corto")sc+=c.t?8:-12;
    if(prof.time==="largo"&&c.p)sc+=4;
    if(prof.mode==="online")sc+=c.on?5:-4;
    if(prof.pri==="empleo")sc+=c.e*3;
    if(prof.pri==="rapido")sc+=c.t?8:0;
    return Object.assign({},c,{sc:Math.max(1,Math.min(99,Math.round(sc)))});
  }).sort((a,b)=>b.sc-a.sc);
}
function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;t.setAttribute("role","status");
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}

function radar(p,top){
  const cx=170,cy=150,R=95;
  const pos=(i,v)=>{const a=(-90+60*i)*Math.PI/180;return [cx+R*v*Math.cos(a),cy+R*v*Math.sin(a)]};
  const ring=v=>ORDER.map((_,i)=>pos(i,v).join(",")).join(" ");
  const axes=ORDER.map((_,i)=>{const e=pos(i,1);return `<line class="ax" x1="${cx}" y1="${cy}" x2="${e[0]}" y2="${e[1]}"/>`}).join("");
  const poly=ORDER.map((a,i)=>pos(i,Math.max(.06,p[a]/100)).join(",")).join(" ");
  const pts=ORDER.map((a,i)=>{const q=pos(i,Math.max(.06,p[a]/100));return `<circle class="pt" cx="${q[0]}" cy="${q[1]}" r="3.5"/>`}).join("");
  const labs=ORDER.map((a,i)=>{const q=pos(i,1.27);return `<text class="${top.includes(a)?"top3":""}" x="${q[0]}" y="${q[1]+4}">${AREAS[a].n}</text>`}).join("");
  return `<svg class="radar" viewBox="0 0 340 300" role="img" aria-label="Gráfica de tu perfil por área">
    <polygon class="g" points="${ring(1)}"/><polygon class="g" points="${ring(.66)}"/><polygon class="g" points="${ring(.33)}"/>${axes}
    <polygon class="poly" points="${poly}"/>${pts}${labs}</svg>`;
}

async function sha256(s){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}

  if(!a||!a.h||a.exp<=Date.now()||!CONFIG.HASHES.includes(a.h))return null;

}
async function unlock(){
  const inp=$("#code"),err=$("#err");if(!inp)return;
  const norm=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(norm.length<17){err.textContent="Escribe el código completo, con el formato RUMBO-XXXX-XXXX-XXXX.";return}
  if(!(window.crypto&&crypto.subtle)){err.textContent="Abre la app desde un enlace https para activar el código.";return}
  const hh=await sha256(norm);
  if(CONFIG.HASHES.includes(hh)){
    const prev=load("rumbo:access");
    const exp=(prev&&prev.h===hh&&prev.exp>Date.now())?prev.exp:Date.now()+CONFIG.ACCESS_DAYS*864e5;
    save("rumbo:access",{h:hh,exp});
    S.screen="welcome";render();
  }else{
    err.textContent="Ese código no es válido. Revisa que esté bien escrito.";
  }
}

function render(){

  const v={gate,welcome,profile,test,result}[S.screen];
  app.innerHTML=v();
  window.scrollTo(0,0);
}
function finish(){
  save("rumbo:last",{prof:S.prof,ans:S.ans,len:S.prof.len});
  S.screen="result";S.more=false;render();
}
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,v=b.dataset.v,g=b.dataset.g;
  if(act==="unlock"){unlock()}
  else if(act==="start"){S.screen="profile";render()}
  else if(act==="home"){S.screen="welcome";render()}
  else if(act==="set"){S.prof[g]=v;const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(act==="subj"){
    const a=S.prof.subj,i=a.indexOf(v);
    if(i>=0)a.splice(i,1);else if(a.length<3)a.push(v);else toast("Elige máximo 3 materias");
    const y=window.scrollY;render();window.scrollTo(0,y);
  }
  else if(act==="begin"){S.qs=buildQs(S.prof.len);S.ans=[];S.i=0;S.screen="test";render()}
  else if(act==="ans"){
    S.ans[S.i]=+v;
    b.parentElement.querySelectorAll(".sc").forEach(x=>x.setAttribute("aria-pressed",x===b));
    setTimeout(()=>{if(S.i<S.qs.length-1){S.i++;render()}else finish()},180);
  }
  else if(act==="prev"){if(S.i===0){S.screen="profile"}else S.i--;render()}
  else if(act==="more"){S.more=true;const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(act==="restart"){S.screen="profile";render()}
  else if(act==="last"){
    const l=load("rumbo:last");if(!l)return;
    S.prof=Object.assign({stage:null,time:null,mode:null,subj:[],pri:null,len:"breve"},l.prof);
    S.qs=buildQs(l.len||S.prof.len);S.ans=l.ans;S.screen="result";S.more=false;render();
  }
  else if(act==="install"&&deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;render()})}
  else if(act==="share"){
    const p=scores(S.qs,S.ans),top=ORDER.slice().sort((a,b)=>p[b]-p[a]).slice(0,3);
    const cs=rank(p,S.prof).slice(0,5).map(c=>`• ${c.n} (${c.sc}%)`).join("\n");
    const txt=`Mi perfil vocacional en Rumbo: ${top.map(a=>AREAS[a].n).join(" · ")}\n\nCarreras con más afinidad:\n${cs}`;
    if(navigator.share){navigator.share({title:"Mi resultado en Rumbo",text:txt}).catch(()=>{})}
    else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast("Resultado copiado"),()=>toast("No se pudo copiar"))}
    else toast("Tu navegador no permite compartir");
  }
});
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
render();
</script>
</body>
</html>
